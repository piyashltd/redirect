<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // আপনার সব শর্টলিংক এখানে লিস্ট করুন
        const links = {
            "ks": "https://stream.mux.com/n7fAmQbGqIek7M5TH4uFTjRgte4oEuPG5600A5TGtRj00.m3u8",
            "yt": "https://youtube.com/c/yourchannel",
            "app": "https://play.google.com/store/apps/details?id=your.app",
            "github": "https://github.com/yourusername"
        };

        // URL এর শেষের # এর পরের অংশটুকু নেওয়া
        const hash = window.location.hash.substring(1); 

        // রিডাইরেক্ট করার লজিক
        if (links[hash]) {
            // যদি লিংক লিস্টে থাকে, তাহলে রিডাইরেক্ট করবে
            window.location.replace(links[hash]);
        } else {
            // যদি কোনো লিংক ম্যাচ না করে, তবে আপনার মেইন ওয়েবসাইটে যাবে
            window.location.replace("https://your-default-website.com");
        }
    </script>
</head>
<body style="background-color: #121212; color: #fff; font-family: sans-serif; text-align: center; margin-top: 20%;">
    <h2>Please wait, redirecting...</h2>
    <p>If not redirected, check if the link is correct.</p>
</body>
</html>
